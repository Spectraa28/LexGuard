services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: lexguard
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  embedding-worker:
    build: ./embedding-worker
    depends_on:
      - postgres
      - rabbitmq
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/lexguard
      - RABBITMQ_HOST=rabbitmq
    restart: always