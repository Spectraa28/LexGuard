server:
  port: 8080

spring:
  application:
    name: lexguard-ingestion

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lexguard}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:default-account-id}
    access-key: ${R2_ACCESS_KEY:default-access-key}
    secret-key: ${R2_SECRET_KEY:default-secret-key}
    bucket-name: ${R2_BUCKET_NAME:lexguard-documents}