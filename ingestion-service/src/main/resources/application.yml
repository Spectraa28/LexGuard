server:
  port: 8080

spring:
  application:
    name: lexguard-ingestion

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lexguard}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:59934ef5305f8cd1c59d112af183d73f}
    access-key: ${R2_ACCESS_KEY:fb3ef59a68f2aa24bd4687df6cb85b45}
    secret-key: ${R2_SECRET_KEY:08805e58a1ad7e1a277f122c0d1e0876fb61243e853ff0162585f08dedcde473}
    bucket-name: ${R2_BUCKET_NAME:lexguard}